<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A.U.R.I.X. TV — UI Preview</title>
<style>
  @font-face {
    font-family: "Arial Black";
    src: url("./app/src/main/res/font/arial_black.ttf") format("truetype");
    font-display: swap;
  }

  /* Values mirror MainActivity.kt. Android dp is shown as CSS px, designed for
     a 960x540 dp screen (a 1080p TV at 320 dpi). */
  :root {
    --tile-w: 190px;
    --tile-h: 132px;
    --tile-gap: 36px;
    --motion: 180ms;
  }

  * { box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; margin: 0; overflow: hidden;
    background: #000; color: #fff;
  }
  body { font-family: "Arial Black", Arial, sans-serif; user-select: none; }

  .screen {
    position: relative; width: 100vw; height: 100vh; min-height: 420px; overflow: hidden;
    background: #000;
  }

  .brand {
    position: absolute; top: 30px; left: 50px;
    padding: 8px 14px; border: 2px solid transparent; border-radius: 12px;
    font: 22px/1.3 "Arial Black", Arial, sans-serif; letter-spacing: .08em;
  }
  .brand.focused {
    text-shadow: 0 0 6px #fff, 0 0 16px rgba(255,255,255,.8);
    box-shadow: 0 0 8px 2px rgba(255,255,255,.45), 0 0 26px 6px rgba(255,255,255,.22);
  }
  .time-box {
    position: absolute; top: 30px; right: 56px; text-align: right; white-space: nowrap;
  }
  #clock { font-size: 30px; line-height: 1; white-space: pre; }
  #date { margin-top: 6px; font-size: 15px; line-height: 1; color: rgba(255,255,255,.75); white-space: pre; }

  .hero {
    position: absolute; left: 64px; top: calc((100% - 110px) / 2); transform: translateY(-50%);
    transition: opacity .22s ease, translate .22s ease;
  }
  .hero.swap { opacity: 0; translate: -16px 0; transition: none; }
  .hero-name { margin-top: 0; font: 58px/1 "Arial Black", Arial, sans-serif; }
  .hero-status { margin-top: 14px; font-size: 15px; color: #ffc107; display: none; }
  .hero-status.missing { display: block; }

  .row {
    position: absolute; left: 50%; bottom: 64px; transform: translateX(-50%);
    display: flex; gap: var(--tile-gap);
  }
  .tile {
    position: relative; width: var(--tile-w); height: var(--tile-h);
    border-radius: 22px; border: 1px solid rgba(255,255,255,.38);
    background: linear-gradient(135deg, rgba(255,255,255,.21), rgba(255,255,255,.06));
    -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
    overflow: hidden; opacity: .8;
    transition: transform var(--motion) ease-out, opacity var(--motion) ease-out,
                background var(--motion) ease-out, border-color var(--motion) ease-out;
  }
  .tile::before { /* top-half sheen */
    content: ""; position: absolute; left: 2px; right: 2px; top: 2px; height: 64px;
    border-radius: 20px; background: linear-gradient(180deg, rgba(255,255,255,.17), transparent);
    pointer-events: none;
  }
  .tile.selected {
    transform: scale(1.08); opacity: 1;
    border: 2px solid rgba(255,255,255,.94);
    background: linear-gradient(135deg, rgba(255,255,255,.41), rgba(255,255,255,.15));
    box-shadow: 0 0 4px 1px rgba(255,255,255,.6), 0 0 14px 3px rgba(255,255,255,.35),
                0 0 30px 6px rgba(255,255,255,.18);
  }
  .tile.selected::before { background: linear-gradient(180deg, rgba(255,255,255,.27), transparent); }
  .tile.dim-focus { border: 1px solid rgba(255,255,255,.38); box-shadow: none;
    background: linear-gradient(135deg, rgba(255,255,255,.21), rgba(255,255,255,.06)); }
  .tile.dim-focus::before { background: linear-gradient(180deg, rgba(255,255,255,.17), transparent); }
  .tile.missing { opacity: .38; }
  .tile img, .tile svg {
    position: absolute; top: 22px; left: 50%; width: 62px; height: 62px;
    transform: translateX(-50%); object-fit: contain;
  }
  .tile.selected img, .tile.selected svg { top: 21px; }
  .tile span {
    position: absolute; bottom: 16px; left: 0; right: 0; text-align: center;
    font-size: 14px; letter-spacing: .04em;
  }
  .tile.selected span { bottom: 15px; }

  .notice {
    position: absolute; left: 50%; top: 66%; transform: translateX(-50%);
    padding: 10px 16px; border: 1px solid rgba(255,255,255,.25); border-radius: 6px;
    background: rgba(25,25,25,.92); font-size: 14px; opacity: 0; transition: opacity .15s ease;
    pointer-events: none;
  }
  .notice.visible { opacity: 1; }
  .help {
    position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%);
    font-size: 12px; letter-spacing: .08em; color: rgba(255,255,255,.38);
    opacity: 0; transition: opacity .2s ease;
  }
  .screen:hover .help { opacity: 1; }
</style>
</head>
<body>
<main class="screen" id="screen" aria-label="A.U.R.I.X. TV launcher preview">

  <div class="brand" id="brand">A.U.R.I.X</div>

  <div class="time-box">
    <div id="clock">01 : 47 PM</div>
    <div id="date">02 / 11 / 2026</div>
  </div>

  <div class="hero" id="hero">
    <div class="hero-name" id="heroName"></div>
    <div class="hero-status" id="heroStatus"></div>
  </div>

  <div class="row" id="row"></div>

  <div class="help">← / → SELECT &nbsp;·&nbsp; ↑ SETTINGS &nbsp;·&nbsp; ENTER OPEN</div>
  <div class="notice" id="notice" role="status"></div>
</main>

<script>
(() => {
  const svg = body => `<svg viewBox="0 0 100 100" fill="none" stroke="#fff" stroke-width="4.5"
    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${body}</svg>`;
  const icons = {
    play: svg(`<rect x="6" y="20" width="88" height="60" rx="16"/><path d="M42 36 L42 64 L65 50 Z"/>`),
    tv: svg(`<rect x="6" y="14" width="88" height="56" rx="8"/><path d="M50 70 V84 M30 86 H70"/>`),
    film: svg(`<rect x="10" y="38" width="80" height="48" rx="6"/><rect x="10" y="18" width="80" height="20" rx="4"/>
      <path d="M30 18 L22 38 M52 18 L44 38 M74 18 L66 38"/>`),
    globe: svg(`<circle cx="50" cy="50" r="44"/><path d="M6 50 H94 M14 28 H86 M14 72 H86"/><ellipse cx="50" cy="50" rx="20" ry="44"/>`)
  };

  // `installed: false` previews the "Not installed" state.
  const apps = [
    { name: "YouTube", icon: "play", installed: true },
    { name: "TV", icon: "tv", installed: true },
    { name: "Netflix", icon: "film", installed: true },
    { name: "Browser", icon: "globe", installed: true }
  ];

  let selected = 0;
  let settingsFocused = false;
  const row = document.getElementById("row");
  const brand = document.getElementById("brand");
    const hero = document.getElementById("hero");
  const notice = document.getElementById("notice");
  let noticeTimer;

  const tiles = apps.map(app => {
    const el = document.createElement("div");
    el.className = "tile";
    el.innerHTML = icons[app.icon] +
      `<span>${app.name}</span>`;
    row.appendChild(el);
    return el;
  });

  function updateClock() {
    const now = new Date();
    const pad = n => String(n).padStart(2, "0");
    const h = now.getHours() % 12 || 12;
    document.getElementById("clock").textContent =
      pad(h) + " : " + pad(now.getMinutes()) + " " + (now.getHours() < 12 ? "AM" : "PM");
    document.getElementById("date").textContent =
      pad(now.getDate()) + " / " + pad(now.getMonth() + 1) + " / " + now.getFullYear();
  }

  function render(animateHero) {
    const app = apps[selected];
    tiles.forEach((el, i) => {
      el.classList.toggle("selected", i === selected);
      el.classList.toggle("dim-focus", i === selected && settingsFocused);
      el.classList.toggle("missing", !apps[i].installed);
    });
    brand.classList.toggle("focused", settingsFocused);

    document.getElementById("heroName").textContent = app.name;
    const status = document.getElementById("heroStatus");
    status.textContent = "Not installed";
    status.classList.toggle("missing", !app.installed);

    if (animateHero) {
      hero.classList.add("swap");
      void hero.offsetWidth;
      hero.classList.remove("swap");
    }
  }

  function showNotice(message) {
    notice.textContent = message;
    notice.classList.add("visible");
    clearTimeout(noticeTimer);
    noticeTimer = setTimeout(() => notice.classList.remove("visible"), 1500);
  }

  document.addEventListener("keydown", event => {
    const key = event.key;
    if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Enter", " "].includes(key)) {
      event.preventDefault();
    }
    if (key === "ArrowUp") { settingsFocused = true; render(true); }
    else if (key === "ArrowDown" || key === "Escape" || key === "Backspace") { settingsFocused = false; render(true); }
    else if (key === "ArrowLeft" && !settingsFocused && selected > 0) { selected--; render(true); }
    else if (key === "ArrowRight" && !settingsFocused && selected < apps.length - 1) { selected++; render(true); }
    else if (key === "Enter" || key === " ") {
      showNotice(settingsFocused ? "TV Settings — native app action"
        : apps[selected].installed ? "Launch " + apps[selected].name + " — native app action"
        : apps[selected].name + " is not installed.");
    }
  });

  tiles.forEach((el, i) => el.addEventListener("click", () => {
    selected = i; settingsFocused = false; render(true);
  }));
  // ?missing=3 previews the "Not installed" state for a tile (e.g. Browser).
  const missing = new URLSearchParams(location.search).get("missing");
  if (missing !== null) apps[Number(missing)].installed = false;
  const start = new URLSearchParams(location.search).get("sel");
  if (start !== null) selected = Math.min(Number(start), apps.length - 1);

  updateClock();
  render(false);
  setInterval(updateClock, 1000);
})();
</script>
</body>
</html>
